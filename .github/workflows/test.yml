name: Test packages
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: main
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Set up Homebrew
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew_bin=/opt/homebrew/bin/brew
          else
            brew_bin=/home/linuxbrew/.linuxbrew/bin/brew
          fi
          if [[ ! -x "$brew_bin" ]]; then
            curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh -o "$RUNNER_TEMP/homebrew-install.sh"
            NONINTERACTIVE=1 bash "$RUNNER_TEMP/homebrew-install.sh"
          fi
          echo "$(dirname "$brew_bin")" >> "$GITHUB_PATH"
          "$brew_bin" update
      - name: Tap the checked-out definitions
        run: |
          brew tap gwen0x4c3/tap "$PWD"
          if brew help trust >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == macOS ]]; then
              brew trust --cask gwen0x4c3/tap/ego-bridge
            else
              brew trust --formula gwen0x4c3/tap/ego-bridge-agent
            fi
          fi
      - name: Install Mac App and CLI
        if: runner.os == 'macOS'
        run: |
          brew install --cask --appdir="$RUNNER_TEMP/Applications" gwen0x4c3/tap/ego-bridge
          "$(brew --prefix)/bin/ego-bridge" --help
          "$(brew --prefix)/bin/ego-bridge" setup --help
          codesign --verify --deep --strict "$RUNNER_TEMP/Applications/EgoBridge.app"
      - name: Install Linux CLI and service
        if: runner.os == 'Linux'
        run: |
          brew install gwen0x4c3/tap/ego-bridge-agent
          brew test gwen0x4c3/tap/ego-bridge-agent
          export EGO_AGENT_CONF="$RUNNER_TEMP/service-test"
          export EGO_BRIDGE_CONFIG="$RUNNER_TEMP/shim.json"
          export EGO_BRIDGE_PORT=3348
          ego-agent-service --bind 127.0.0.1 --port 3348 >"$RUNNER_TEMP/service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid"' EXIT
          for attempt in {1..100}; do
            grep -q '"ev": "listening"' "$RUNNER_TEMP/service.log" && break
            sleep 0.1
          done
          grep -q '"ev": "listening"' "$RUNNER_TEMP/service.log"
          ego-browser pair > "$RUNNER_TEMP/pair.txt"
          grep -Eq '[a-z2-9]{4}-[a-z2-9]{4}' "$RUNNER_TEMP/pair.txt"
